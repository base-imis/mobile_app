apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// google-services.json lives in src/prod (package com.imisbase) and is git-ignored.
// Dev builds (com.imisbase.dev) and checkouts without the file should still build.
googleServices {
    missingGoogleServicesStrategy = com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.WARN
}

project.ext.envConfigFiles = [
    devdebug: ".env.dev",
    devrelease: ".env.dev",
    proddebug: ".env.prod",
    prodrelease: ".env.prod",
]

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"
/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.imisbase"
    defaultConfig {
        applicationId "com.imisbase"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.0.3"
         resValue "string", "build_config_package", "com.imisbase"

    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release credentials are read from ~/.gradle/gradle.properties or the
        // environment so they never enter source control.
        release {
            def storePath = project.findProperty('IMIS_RELEASE_STORE_FILE') ?: System.getenv('IMIS_RELEASE_STORE_FILE')
            def storePass = project.findProperty('IMIS_RELEASE_STORE_PASSWORD') ?: System.getenv('IMIS_RELEASE_STORE_PASSWORD')
            def alias = project.findProperty('IMIS_RELEASE_KEY_ALIAS') ?: System.getenv('IMIS_RELEASE_KEY_ALIAS')
            def keyPass = project.findProperty('IMIS_RELEASE_KEY_PASSWORD') ?: System.getenv('IMIS_RELEASE_KEY_PASSWORD')
            if (storePath) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
                // v1 (JAR) stays on: minSdkVersion is 23 and Android 6 cannot verify
                // v2/v3-only APKs ("Missing META-INF/MANIFEST.MF"). v2/v3 are used on 7.0+.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // VAPT AND-DEBUG-SIGNED: release output must never carry the debug
            // certificate. When no release keystore is configured the build fails
            // (see the taskGraph guard below) instead of falling back to debug.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    flavorDimensions "env"
    productFlavors {
        dev {
            resValue "string", "app_name", "Base IMIS Dev"
            applicationIdSuffix ".dev"
        }
        prod {
            resValue "string", "app_name", "Base IMIS"
            applicationIdSuffix ""
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    implementation 'com.google.android.gms:play-services-location:21.0.1'


    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

/**
 * VAPT AND-DEBUG-SIGNED guard.
 *
 * Fails any release assemble/bundle/install before it runs unless a real release
 * keystore has been supplied. This makes it structurally impossible to ship a
 * debug-signed artifact again, which is what the assessment flagged as Critical.
 */
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name ==~ /(?i)(assemble|bundle|install)(Dev|Prod)Release/ }
    if (wantsRelease && android.signingConfigs.release.storeFile == null) {
        throw new GradleException(
            "Release signing is not configured, refusing to produce a debug-signed release.\n" +
            "Set IMIS_RELEASE_STORE_FILE, IMIS_RELEASE_STORE_PASSWORD, IMIS_RELEASE_KEY_ALIAS and\n" +
            "IMIS_RELEASE_KEY_PASSWORD in ~/.gradle/gradle.properties or the environment."
        )
    }
}
